name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# The repo's default GITHUB_TOKEN is read-only; pushing to GHCR needs packages:write.
permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: fly
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build & push image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/ziggler:latest
          docker build -t "$IMAGE" -f Dockerfile.prod .
          docker push "$IMAGE"

      - name: Fly deploy
        uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --image ghcr.io/${{ github.repository_owner }}/ziggler:latest --yes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}